[package]
name = "launcher"
description = "A keyboard-first launcher with JavaScript extensions, built on GPUI Kit and GPUI Shell."
version = "0.6.5"
publish = false
edition.workspace = true

[dependencies]
anyhow.workspace = true
dirs = "6"
global-hotkey = "0.8"
gpui-kit.workspace = true
gpui-shell.workspace = true
interprocess = "2"
percent-encoding = "2"
serde.workspace = true
serde_json.workspace = true
smol.workspace = true
tracing.workspace = true
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
