[package]
name = "launcher"
description = "A keyboard-first launcher with JavaScript extensions, built on GPUI Kit and GPUI Shell."
version = "0.6.5"
publish = false
edition.workspace = true

[dependencies]
anyhow.workspace = true
chrono = "0.4.38"
chrono-tz = "0.10"
dirs = "6"
global-hotkey = "0.8"
gpui-kit.workspace = true
gpui-shell.workspace = true
icns = "0.3"
imagesize = "0.14"
interprocess = "2"
keyring = "4"
notify.workspace = true
percent-encoding = "2.3"
raw-window-handle.workspace = true
pinyin = { version = "0.10", default-features = false, features = ["heteronym", "plain"] }
plist = "1"
reqwest = { workspace = true, features = ["blocking", "json"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sysinfo = "0.37"
smol.workspace = true
tracing.workspace = true
url = "2"
emojis = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"] }
sys-locale = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_Graphics_Dwm", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_WinRT", "Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage", "Storage_Streams", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
