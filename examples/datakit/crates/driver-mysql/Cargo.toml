[package]
name = "datakit-driver-mysql"
description = "DataKit's MySQL and MariaDB driver."
version = "0.6.5"
publish = false
edition.workspace = true

[dependencies]
anyhow.workspace = true
datakit-catalog = { path = "../catalog" }
datakit-driver = { path = "../driver" }
futures = "0.3"
mysql_async = { version = "0.37", default-features = false, features = [
    "minimal-rust",
    "rustls-tls",
    "ring",
    "tls12",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "net", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
datakit-runtime = { path = "../runtime" }

[lints]
workspace = true
