[package]
name = "datakit-driver-clickhouse"
description = "DataKit's ClickHouse driver, over the HTTP interface."
version = "0.6.5"
publish = false
edition.workspace = true

[dependencies]
anyhow.workspace = true
bytes = "1"
datakit-catalog = { path = "../catalog" }
datakit-driver = { path = "../driver" }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
datakit-runtime = { path = "../runtime" }

[lints]
workspace = true
